name: Refresh stock quotes and publish
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # UTC: every 20 minutes, 09:37–16:17 IST, Monday–Friday.
    - cron: '7,27,47 4-10 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: stock-quotes-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect real quotes
        run: python scripts/collect_quotes.py
      - name: Save latest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update NSE quote snapshot"
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html quotes.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
