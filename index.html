*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#202c32;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}main{max-width:820px;margin:64px auto;padding:0 26px}header{margin-bottom:34px}h1{font-size:30px;letter-spacing:-1px;font-weight:600;margin:0 0 8px}header p{color:#737b7e;font-size:14px;margin:0}.list{background:#fff;border:1px solid #e3e6e3;border-radius:12px;padding:0 28px}.stock{padding:26px 0;border-bottom:1px solid #e8eae7}.stock:last-child{border:0}.top{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:20px;align-items:start}.column-label{display:block;font-size:10px;color:#89918e;font-weight:400;letter-spacing:0;margin-bottom:7px}.sold{text-align:right;font-size:18px;font-weight:500;white-space:nowrap}.sold.pending{font-size:13px;color:#737b7e}.name{font-size:16px;font-weight:600;margin:0}.symbol{font-size:11px;letter-spacing:.07em;color:#89918e;margin-top:5px}.price{text-align:right;font-size:21px;font-weight:600;letter-spacing:-.5px}.price small{display:block;font-size:10px;color:#89918e;font-weight:400;letter-spacing:0;margin-top:5px}.range{margin-top:24px}.track{height:4px;background:#e9edeb;border-radius:4px;position:relative;margin:0 6px}.fill{height:100%;width:var(--position);background:#a9c5b8;border-radius:4px}.marker{position:absolute;left:var(--position);top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:#2b6551;border:2px solid white;box-shadow:0 0 0 1px #2b6551}.limits{display:flex;justify-content:space-between;margin-top:12px;font-size:13px}.limits span:last-child{text-align:right}.limits small{display:block;font-size:10px;color:#8a918e;margin-top:3px}.unavailable{color:#8a918e;font-size:12px}.outside{font-size:11px;color:#8a918e;margin-top:10px}footer{font-size:11px;line-height:1.8;color:#858d88;margin:18px 2px}a{color:inherit}@media(max-width:600px){.top{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 12px}.identity{grid-column:1/-1}.price{text-align:left}.sold{font-size:17px}}@media(max-width:480px){main{margin:30px auto;padding:0 16px}.list{padding:0 20px}h1{font-size:27px}.price{font-size:19px}.name{font-size:15px}.stock{padding:24px 0}}

@media(max-width:699px){

 .top{display:grid;grid-template-columns:minmax(0,1fr) 116px;gap:8px;align-items:start}
 .identity{grid-column:auto}.name{font-size:13px;line-height:1.3}
 .symbol{display:none}.price{text-align:right;font-size:15px;line-height:1.2;letter-spacing:0}
 .price>.column-label{display:none}.price::before{content:'●';color:#2b6551;font-size:8px;margin-right:5px;vertical-align:middle}
 .price small{display:none}
 .range,.range.has-sale{margin-top:24px}
 .sale-label{font-size:10px;bottom:15px}
 .sale-marker{width:8px;height:8px;top:-10px}.sale-stem{top:-6px;height:8px}
 .marker{width:10px;height:10px}.track{height:3px}
 .limits{margin-top:6px;font-size:11px;line-height:1.2}
 .limits small{display:inline;font-size:9px;margin-left:4px}
 .pending-note{position:absolute;top:31px;left:0;margin:0;font-size:10px}
 .outside{font-size:10px;margin-top:5px}
 footer{font-size:10px;line-height:1.4;margin:8px 1px}
}
@media(max-width:699px) and (max-height:680px){
 main{margin:8px auto}header{margin-bottom:7px}.stock{padding:7px 0}
 .range,.range.has-sale{margin-top:22px}.pending-note{top:28px}
}
.quote-times{font-size:11px;color:#737b7e;margin:10px 2px}.quote-times summary{cursor:pointer}.quote-times p{line-height:1.5}.quote-times ul{padding-left:18px;line-height:1.7}@media(min-width:700px){.quote-times{display:none}}
#refresh-now{float:right;padding:8px 12px;border:1px solid #ccd7cf;border-radius:6px;background:white;color:#245641;font:inherit;font-size:12px;cursor:pointer}#refresh-now:disabled{opacity:.6;cursor:wait}.freshness{font-size:12px;line-height:1.4;margin:0 0 12px;padding:8px 10px;border-radius:6px}.freshness.stale{background:#fff0e7;color:#9b3c18}.freshness.ok{background:#edf5ef;color:#245641}.stale-row .price{color:#9b3c18}.quote-warning{display:block;font-size:10px;font-weight:500;color:#9b3c18;margin-top:3px}@media(max-width:699px){.freshness{font-size:10px;margin-bottom:7px;padding:6px 8px}.price small{display:block;font-size:8px}.quote-warning{font-size:9px}}

<body>
<main>
<header><button id="refresh-now" type="button">Refresh Now</button><h1>Stocks</h1><p>Where today’s price sits in the 52-week range.</p></header>
<p id="freshness" role="status" class="freshness stale">STALE · Saved snapshot; awaiting fresh quotes.</p>
<div class="list" id="stocks" aria-label="Stock prices and 52-week ranges"></div>
<details class="quote-times"><summary>Quote times &amp; marker key</summary><p>● Green: current price · ◆ Gold: last sold price. Line ends: 52-week low and high.</p><ul id="quote-times"></ul></details>
<footer id="status" role="status">Loading collected quotes…</footer>
<noscript>Enable JavaScript to display stock prices.</noscript>
</main>
<script id="initial-quotes" type="application/json">{

<script>
'use strict';
const stocks=[['ZOMIIM','Eternal (Zomato)','ETERNAL'],['ADAPOR','Adani Ports','ADANIPORTS'],['ADAPOW','Adani Power','ADANIPOWER'],['YESBANK','Yes Bank','YESBANK'],['JIOFIN','Jio Financial Services','JIOFIN'],['CIPLA','Cipla','CIPLA']];
// User-provided sale history, independent of the scraped market quotes.
const lastSold={ZOMIIM:324.45,ADAPOR:1735.50,ADAPOW:204.23,YESBANK:null,JIOFIN:null,CIPLA:null};
const money=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:2,maximumFractionDigits:2});
const finite=n=>typeof n==='number'&&Number.isFinite(n)&&n>0;
const date=s=>new Date(s).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'})+' IST';
function rangePosition(price,low,high){return high===low?50:Math.max(0,Math.min(100,(price-low)/(high-low)*100));}
function element(tag,className,text){const el=document.createElement(tag);el.className=className;if(text!==undefined)el.textContent=text;return el;}
// Host api/quotes.py alongside this page, or set this to its HTTPS URL.
const QUOTE_API='/api/quotes';
const REFRESH_MS=120000, MAX_RESPONSE_AGE_MS=180000, MAX_QUOTE_AGE_MS=30*60000;
let lastData=null, lastSuccessfulResponse=null, refreshFailed=true, busy=false, timer=null;
function staleQuote(q,now=Date.now()){
 const stamp=Date.parse(q.asOf);
 // Conservative outside market hours too: old quotes remain explicitly stale.
 return !Number.isFinite(stamp)||stamp>now+300000||now-stamp>MAX_QUOTE_AGE_MS;
}
function validate(data,api=false){
 const now=Date.now(),stamp=Date.parse(data?.collectedAt);
 if(!Number.isFinite(stamp)||stamp>now+300000||!Array.isArray(data?.quotes)||data.quotes.length!==stocks.length)throw Error('Invalid quote response');
 if(api&&(data.mode!=='on-demand'||now-stamp>MAX_RESPONSE_AGE_MS))throw Error('Server returned an old snapshot');
 for(const [label,,ticker] of stocks){const matches=data.quotes.filter(q=>q&&q.symbol===label);const q=matches[0];
  if(matches.length!==1||q.ticker!==ticker+'.NS'||!finite(q.price)||!finite(q.low52)||!finite(q.high52)||q.low52>q.high52||!Number.isFinite(Date.parse(q.asOf))||Date.parse(q.asOf)>now+300000)throw Error('Incomplete or invalid stock data');
 }
}
function render(data){
 validate(data);
 const list=document.getElementById('stocks');list.replaceChildren();
 for(const [label,name,symbol] of stocks){
  const q=data.quotes.find(q=>q.symbol===label), row=element('section','stock');
  row.dataset.symbol=label;
  const top=element('div','top'),identity=element('div','identity');
  identity.append(element('h2','name',name),element('div','symbol','NSE · '+symbol));
  const valid=q&&finite(q.price)&&Number.isFinite(Date.parse(q.asOf));
  const price=element('div','price',valid?money.format(q.price):'—');
  price.prepend(element('span','column-label','Current price'));
  price.append(element('small','',valid?date(q.asOf):'Quote unavailable'));
  top.append(identity,price);row.append(top);
  if(valid&&finite(q.low52)&&finite(q.high52)&&q.high52>=q.low52){
   const range=element('div','range'),track=element('div','track');
   const position=rangePosition(q.price,q.low52,q.high52);
   track.style.setProperty('--position',position+'%');track.setAttribute('role','img');
   track.setAttribute('aria-label',`${name}: current price ${money.format(q.price)}; 52-week low ${money.format(q.low52)}, high ${money.format(q.high52)}.`);
   track.append(element('div','fill'),element('div','marker'));
   const sale=lastSold[label];
   if(finite(sale)){
    range.classList.add('has-sale');
    track.style.setProperty('--sold-position',rangePosition(sale,q.low52,q.high52)+'%');
    track.append(element('div','sale-stem'),element('div','sale-marker'),element('span','sale-label','Last sold '+money.format(sale)));
    track.setAttribute('aria-label',track.getAttribute('aria-label')+' Last sold at '+money.format(sale)+', positioned within the current 52-week range.');
   }
   const limits=element('div','limits');
   for(const [value,caption] of [[q.low52,'52-week low'],[q.high52,'52-week high']]){const span=element('span','',money.format(value));span.append(element('small','',caption));limits.append(span);}
   range.append(track,limits);
   if(q.price<q.low52||q.price>q.high52)range.append(element('div','outside','Latest price is outside the reported range; marker shown at the nearest end.'));
   if(finite(sale)&&(sale<q.low52||sale>q.high52))range.append(element('div','outside','Last sale is outside the current 52-week range; sale marker shown at the nearest end.'));
   row.append(range);
  }else {
   row.append(element('p','unavailable','52-week range unavailable'));
   if(finite(lastSold[label]))row.append(element('p','sale-fallback','Last sold '+money.format(lastSold[label])));
  }
  if(lastSold[label]===null)row.append(element('p','pending-note','Yet to sell'));
  list.append(row);
 }
 const times=document.getElementById('quote-times');times.replaceChildren();
 for(const [label,name] of stocks){const q=data.quotes.find(q=>q.symbol===label);times.append(element('li','',name+': '+(q&&Number.isFinite(Date.parse(q.asOf))?date(q.asOf):'Unavailable')));}
 lastData=data;setStatus();
}
function setStatus(){
 const responseOld=!lastSuccessfulResponse||Date.now()-lastSuccessfulResponse>MAX_RESPONSE_AGE_MS;
 const quoteOld=!lastData||lastData.quotes.some(q=>staleQuote(q));
 const stale=refreshFailed||responseOld||quoteOld;
 const badge=document.getElementById('freshness');badge.className='freshness '+(stale?'stale':'ok');
 badge.textContent=stale?'STALE · '+(refreshFailed?'Fresh quotes could not be confirmed.':responseOld?'The last successful response is overdue.':'One or more market quotes are over 30 minutes old; the market may be closed.'):'Updated · Provider quotes may be delayed.';
 document.getElementById('status').textContent='Last successful API response: '+(lastSuccessfulResponse?date(lastSuccessfulResponse):'None this session')+'. '+(lastData?'Quote collection: '+date(lastData.collectedAt)+'. ':'')+'Refreshes every 2 minutes. Quote times shown per stock.';
 document.querySelectorAll('.stock').forEach(row=>{
  const q=lastData?.quotes.find(q=>q.symbol===row.dataset.symbol);
  const old=refreshFailed||responseOld||!q||staleQuote(q);
  row.classList.toggle('stale-row',old);row.querySelector('.quote-warning')?.remove();
  row.querySelector('.column-label').textContent=old?'Last known price':'Current price';
  if(old)row.querySelector('.price').append(element('span','quote-warning','STALE'));
 });
}
async function refresh(){
 if(busy)return;
 busy=true;clearTimeout(timer);
 const button=document.getElementById('refresh-now');button.disabled=true;button.textContent='Refreshing…';
 try{
  if(location.protocol==='file:')throw Error('Open the hosted page to use the quote API');
  const url=new URL(QUOTE_API,location.href);url.searchParams.set('_',Date.now());
  const res=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(30000)});
  if(!res.ok)throw Error('Quote service unavailable ('+res.status+')');
  const data=await res.json();validate(data,true);
  // Never call a static JSON download a successful live API response.
  lastSuccessfulResponse=Date.now();refreshFailed=false;render(data);
 }catch(error){refreshFailed=true;setStatus();document.getElementById('freshness').textContent='STALE · Refresh failed. Showing last known data only. '+error.message;}
 finally{busy=false;button.disabled=false;button.textContent='Refresh Now';timer=setTimeout(refresh,REFRESH_MS);}
}
try{render(JSON.parse(document.getElementById('initial-quotes').textContent));}catch{setStatus();}
document.getElementById('refresh-now').addEventListener('click',refresh);
window.addEventListener('online',refresh);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
setInterval(setStatus,15000);
refresh();
</script>
